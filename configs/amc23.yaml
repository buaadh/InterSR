# AMC23 evaluation config
sample_n: 1
model_name: DeepSeek-R1-Distill-Qwen-7B
embedding_dim: 3584
evaluation:
  method: 'custom_generate'
  batch_size: 1
  gpu_num: 1
thinking:
  think_threshold: 0.4
  min_think_tokens: 10
  min_normal_tokens: 10
  think_prompt: ''
think_begin: true
generation:
  max_new_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  do_sample: true
dataset:
  name: "amc23"
  hf_path: "AI-MO/aimo-validation-amc"
  split: "train"
  question_key: "problem"
  answer_key: "answer"
prompt:
  output_format: ""
